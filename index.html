<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アプリ一覧</title>
    <meta name="description" content="公開中のアプリ一覧です。" />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background-color: #fdfcf8;
        color: #2c2a29;
      }

      body {
        margin: 0;
        padding: 0 1.5rem 3rem;
        max-width: 960px;
        margin-left: auto;
        margin-right: auto;
        background: radial-gradient(
            circle at top left,
            #fff6d6,
            transparent 45%
          ),
          radial-gradient(circle at top right, #e0f3ff, transparent 40%),
          #fffbf4;
      }

      header {
        padding: 3rem 0 1.25rem;
      }

      h1 {
        font-size: clamp(2rem, 2vw + 1.5rem, 2.5rem);
        margin: 0 0 0.5rem;
      }

      p {
        margin: 0.5rem 0 0;
        line-height: 1.7;
        color: rgba(44, 42, 41, 0.8);
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 2rem 0 0;
        display: grid;
        gap: 1.25rem;
      }

      li {
        margin: 0;
      }

      a.app-card {
        display: flex;
        gap: 1rem;
        align-items: flex-start;
        padding: 1.5rem 1.75rem;
        border-radius: 18px;
        border: 1px solid rgba(255, 195, 113, 0.4);
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 244, 225, 0.9)
        );
        text-decoration: none;
        color: inherit;
        box-shadow: 0 10px 30px rgba(255, 181, 46, 0.15);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      a.app-card:hover,
      a.app-card:focus-visible {
        transform: translateY(-6px);
        box-shadow: 0 16px 36px rgba(255, 181, 46, 0.24);
      }

      .app-order {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffb52e, #ff8d6b);
        color: #fffef9;
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
      }

      .app-card h2 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
      }

      .app-card p {
        margin: 0.5rem 0 0;
        color: rgba(17, 17, 17, 0.75);
      }

      .app-info {
        display: flex;
        flex-direction: column;
      }

      footer {
        margin-top: 3.5rem;
        font-size: 0.875rem;
        color: rgba(44, 42, 41, 0.6);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hikaru Apps</h1>
      <p>公開しているアプリをこちらから参照できます。随時更新予定です。</p>
    </header>

    <ul>
      <li>
        <a class="app-card" href="./tsumimemo/index.html">
          <span class="app-order">1</span>
          <div class="app-info">
            <h2>積みメモ</h2>
            <p>
              習慣化をサポートするメモアプリ。使い方・サポート情報はこちらから確認できます。
            </p>
          </div>
        </a>
      </li>
      <!-- <li>
        <a class="app-card" href="./gametodo/index.html">
          <span class="app-order">2</span>
          <div class="app-info">
            <h2>ゲーム風Todoアプリ - レベルやステータスが上がる</h2>
            <p>タスクを進めて経験値を貯め、レベルやステータスが上がるTodoアプリ。使い方・サポート情報はこちらから確認できます。</p>
          </div>
        </a>
      </li> -->
    </ul>

    <footer>© 2025 Hikaru</footer>
  </body>
</html>
